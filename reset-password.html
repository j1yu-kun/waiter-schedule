<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Восстановление пароля | Детский сад</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1c2935;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(100%,420px);background:white;padding:30px;border-radius:22px;box-shadow:0 12px 40px #182d4518}h1{font-size:25px;margin:8px 0 10px}p{color:#607080;line-height:1.5}.mark{font-size:32px}label{display:block;font-weight:650;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #cad3dc;border-radius:10px;font-size:16px}button{width:100%;background:#176e58;color:white;border:0;border-radius:11px;padding:14px;margin-top:22px;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:16px;padding:12px;border-radius:10px;display:none;line-height:1.45}.status.show{display:block}.status.error{background:#fff0ef;color:#9c2929}.status.ok{background:#eaf8f1;color:#166d4c}a{color:#176e58}.foot{margin-top:22px;text-align:center}
</style>
</head>
<body><main class="panel"><div class="mark">🔐</div><h1>Новый пароль</h1><p id="intro">Проверяем ссылку восстановления…</p>
<form id="form" hidden><label for="password">Новый пароль</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Не менее 8 символов"><label for="repeat">Повторите пароль</label><input id="repeat" type="password" autocomplete="new-password" minlength="8" required placeholder="Повторите новый пароль"><button id="save" type="submit">Сохранить новый пароль</button></form>
<div id="status" class="status" role="status" aria-live="polite"></div><div class="foot"><a href="./">Вернуться на страницу входа</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ВСТАВЬТЕ URL и publishable/anon key из Supabase → Project Settings → API.
// Никогда не вставляйте service_role или secret key.
const SUPABASE_URL = 'PASTE_SUPABASE_PROJECT_URL_HERE';
const SUPABASE_ANON_KEY = 'PASTE_SUPABASE_ANON_KEY_HERE';
const intro = document.getElementById('intro');
const form = document.getElementById('form');
const status = document.getElementById('status');
function notice(message, error=false){status.textContent=message;status.className='status show '+(error?'error':'ok');}
function invalid(message){intro.textContent='Ссылка восстановления недействительна или срок её действия истёк.';notice(message||'Запросите новое письмо для восстановления пароля.',true);form.hidden=true;}
(async()=>{
  if(SUPABASE_URL.startsWith('PASTE_')||SUPABASE_ANON_KEY.startsWith('PASTE_')){invalid('Страница ещё не настроена: необходимо указать URL проекта и публичный ключ Supabase.');return;}
  if(!window.supabase){invalid('Не удалось загрузить библиотеку Supabase. Проверьте подключение к интернету.');return;}
  const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{detectSessionInUrl:true,persistSession:false,autoRefreshToken:false}});
  const query=new URLSearchParams(location.search);
  const fragment=new URLSearchParams(location.hash.slice(1));
  const authError=query.get('error_description')||fragment.get('error_description');
  if(authError){invalid(authError.replace(/\+/g,' '));return;}
  let recoveryVerified=false;
  try{
    const tokenHash=query.get('token_hash');
    if(tokenHash && (query.get('type')==='recovery')){
      const {error}=await client.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
      if(error)throw error;
      recoveryVerified=true;
    }else if(query.get('code')){
      const {error}=await client.auth.exchangeCodeForSession(query.get('code'));
      if(error)throw error;
      recoveryVerified=true;
    }else if(fragment.get('access_token') && fragment.get('refresh_token') && fragment.get('type')==='recovery'){
      const {error}=await client.auth.setSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});
      if(error)throw error;
      recoveryVerified=true;
    }
    if(!recoveryVerified){invalid('Откройте страницу по ссылке из письма восстановления, а не напрямую.');return;}
    const {data:{user},error}=await client.auth.getUser();
    if(error||!user){invalid('Не удалось подтвердить пользователя. Запросите новую ссылку.');return;}
    intro.textContent='Введите новый пароль для своего аккаунта.';
    form.hidden=false;
    history.replaceState(null,'',location.pathname);
    form.addEventListener('submit',async(event)=>{
      event.preventDefault();
      const password=document.getElementById('password').value;
      const repeat=document.getElementById('repeat').value;
      if(password.length<8){notice('Пароль должен содержать минимум 8 символов.',true);return;}
      if(password!==repeat){notice('Пароли не совпадают.',true);return;}
      const save=document.getElementById('save');save.disabled=true;
      try{
        const {error}=await client.auth.updateUser({password});
        if(error)throw error;
        form.hidden=true;intro.textContent='Пароль успешно изменён.';
        notice('Готово! Теперь можно войти в портал с новым паролем.');
        await client.auth.signOut({scope:'local'});
      }catch(e){notice(e.message||'Не удалось изменить пароль.',true)}
      finally{save.disabled=false}
    });
  }catch(e){invalid(e.message||'Не удалось проверить ссылку восстановления.');}
})();
</script></body></html>
